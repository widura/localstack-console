<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LocalStack Console</title><link rel="stylesheet" href="/style.css"></head>
<body><aside><a class="brand" href="/">▧ <span>stack<span class="muted">console</span></span></a><div class="caption">LOCAL DEVELOPMENT</div><nav id="nav" aria-label="Services"></nav><div class="sidefoot"><span class="dot"></span> Local resources<br><small>Test credentials · No AWS account</small></div></aside>
<main><header><div><span class="caption">WORKSPACE / LOCALSTACK</span><h1 id="title">Overview</h1></div><div class="tools"><label>Region <input id="region" value="eu-west-2" aria-label="AWS region"></label><button id="refresh">↻ Refresh</button></div></header>
<div class="connection"><span id="status">Checking connection…</span><code id="endpoint"></code></div><div id="error" role="alert" hidden></div><div id="notice" role="status" hidden></div><section id="summary"></section><section class="panel"><div class="panelhead"><div><h2 id="listTitle">Service health</h2><p id="hint">Your local development environment at a glance.</p></div><div class="tools"><input id="search" placeholder="Filter resources…" aria-label="Filter resources"><button id="create" hidden>+ Create</button></div></div><div id="list" aria-live="polite"></div></section>
<section id="detailPanel" class="panel" hidden><div class="panelhead"><h2 id="detailTitle">Resource details</h2><button id="close">Close</button></div><div id="actions" class="tools detailtools"></div><pre id="detail"></pre></section><footer>LocalStack Console <span>Small tools. Short feedback loops.</span></footer></main>
<dialog id="dialog"><form id="form"><h2 id="dialogTitle"></h2><p id="dialogHint"></p><div id="fields"></div><div id="formError" role="alert" hidden></div><div class="tools"><button type="button" id="cancel">Cancel</button><button type="submit" id="submit" class="primary">Create resource</button></div></form></dialog><script src="/app.js"></script><script src="/workflows.js"></script><script src="/advanced.js"></script><script src="/s3.js"></script><script src="/configuration.js"></script><script src="/developer.js"></script></body></html>
